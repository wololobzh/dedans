services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-school}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school}
      POSTGRES_DB: ${POSTGRES_DB:-school_erp}
    volumes:
      - school_erp_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-school} -d ${POSTGRES_DB:-school_erp}"
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  db-init:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-school}:${POSTGRES_PASSWORD:-school}@postgres:5432/${POSTGRES_DB:-school_erp}?schema=public
    command: >-
      sh -c "
      pnpm --filter @school-erp/database db:push -- --accept-data-loss &&
      pnpm --filter @school-erp/database db:seed
      "
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 3001
      API_SESSION_SECRET: ${API_SESSION_SECRET:-school-erp-local-session-secret-v1}
      API_SESSION_SECRET_EXTERNAL: ${API_SESSION_SECRET:+true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-school}:${POSTGRES_PASSWORD:-school}@postgres:5432/${POSTGRES_DB:-school_erp}?schema=public
    command: ["sh", "scripts/run-service.sh", "api"]
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      INTERNAL_API_URL: http://api:3001
      API_SESSION_TOKEN: ${API_SESSION_TOKEN:-}
      API_SESSION_TOKEN_EXTERNAL: ${API_SESSION_TOKEN:+true}
      LOCAL_SESSION_SECRET: ${API_SESSION_SECRET:-school-erp-local-session-secret-v1}
      LOCAL_SESSION_PROFILE: ${LOCAL_SESSION_PROFILE:-national-admin}
      LOCAL_SESSION_CAMPUS_IDS: ${LOCAL_SESSION_CAMPUS_IDS:-}
    command: ["sh", "scripts/run-service.sh", "web"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  school_erp_postgres: