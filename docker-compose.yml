services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-school}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school}
      POSTGRES_DB: ${POSTGRES_DB:-school_erp}
    volumes:
      - school_erp_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-school} -d ${POSTGRES_DB:-school_erp}"
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  db-init:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-school}:${POSTGRES_PASSWORD:-school}@postgres:5432/${POSTGRES_DB:-school_erp}?schema=public
    command: >-
      sh -c '
      pnpm --filter @school-erp/database db:generate &&
      state=$$(node packages/database/scripts/migration-state.mjs) &&
      case "$$state" in
        empty) pnpm --filter @school-erp/database exec prisma migrate deploy ;;
        pending) pnpm --filter @school-erp/database exec prisma migrate deploy ;;
        partial)
          pnpm --filter @school-erp/database exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script > /tmp/repair.sql &&
          pnpm --filter @school-erp/database exec prisma db execute --file /tmp/repair.sql &&
          for migration in 20260827000100_init 20260828000100_add_campus_lifecycle_and_audit 20260829000100_add_campus_type_and_timezone 20260829000200_allow_virtual_campus_without_city; do
            pnpm --filter @school-erp/database exec prisma migrate resolve --applied "$$migration";
          done ;;
        tracked) pnpm --filter @school-erp/database exec prisma migrate deploy ;;
        drifted) echo "Database migration history is complete but the schema is incomplete or drifted" >&2; exit 1 ;;
        *) echo "Unknown database migration state: $$state" >&2; exit 1 ;;
      esac && node packages/database/scripts/migration-state.mjs --verify
      '
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 3001
      API_SESSION_SECRET: ${API_SESSION_SECRET:-school-erp-local-session-secret-v1}
      API_SESSION_SECRET_EXTERNAL: ${API_SESSION_SECRET:+true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-school}:${POSTGRES_PASSWORD:-school}@postgres:5432/${POSTGRES_DB:-school_erp}?schema=public
    command: ["sh", "scripts/run-service.sh", "api"]
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      INTERNAL_API_URL: http://api:3001
      API_SESSION_TOKEN: ${API_SESSION_TOKEN:-}
      API_SESSION_TOKEN_EXTERNAL: ${API_SESSION_TOKEN:+true}
      LOCAL_SESSION_SECRET: ${API_SESSION_SECRET:-school-erp-local-session-secret-v1}
      LOCAL_SESSION_PROFILE: ${LOCAL_SESSION_PROFILE:-national-admin}
      LOCAL_SESSION_CAMPUS_IDS: ${LOCAL_SESSION_CAMPUS_IDS:-}
    command: ["sh", "scripts/run-service.sh", "web"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  school_erp_postgres: